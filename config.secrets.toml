# env: secrets. Templates that read Bitwarden values (see fnox.toml); apply
# with `mise run apply`.

[dotfiles]
"~/.gitconfig" = { source = "templates/gitconfig.tera", mode = "template", permissions = "0600" }
"~/.ssh" = { permissions = "0700" }
"~/.ssh/config" = { source = "templates/ssh_config.tera", mode = "template", permissions = "0600" }
"~/.zshrc.local" = { source = "templates/zshrc.local.tera", mode = "template", permissions = "0600" }
