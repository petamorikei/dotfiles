#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = true
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true

[preview]
tab_size = 2
max_width = 3840
max_height = 3840
cache_dir = ""
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = '${EDITOR:-vi} %s', block = true, desc = "Edit", for = "unix" },
  { run = 'code %s', orphan = true, desc = "Open in VS Code", for = "unix" },
  { run = 'code %s', orphan = true, desc = "Open in VS Code", for = "windows" },
]
view_source = [
  { run = 'bat %s', block = true, desc = "View Source", for = "unix" },
]
open = [
  { run = 'xdg-open %s1', orphan = true, desc = "Open", for = "linux" },
  { run = 'open %s', orphan = true, desc = "Open", for = "macos" },
  { run = 'start "" %s1', orphan = true, desc = "Open", for = "windows" },
]
reveal = [
  { run = 'open -R %s1', orphan = true, desc = "Reveal", for = "macos" },
  { run = 'xdg-open %d1', orphan = true, desc = "Reveal", for = "linux" },
  { run = 'explorer /select,%s1', orphan = true, desc = "Reveal", for = "windows" },
]
view_exif = [
  { run = '''exiftool %s1; echo "Press enter to exit"; read''', block = true, desc = "View EXIF", for = "unix" },
]
extract = [
  { run = 'unar %s1', desc = "Extract here", for = "unix" },
  { run = 'unar %s1', desc = "Extract here", for = "windows" },
]
trash = [
  { run = "ya pub trash-restore --list %S", desc = "Restore selected files" },
  { run = "ya pub trash-empty --list %S", desc = "Empty trash bin" },
]
view_image = [
  { run = '''timg --title --center --upscale %s; echo "Press enter to exit"; read''', block = true, desc = "View in Terminal", for = "unix" },
]
play = [
  { run = 'mpv %s', orphan = true, desc = "Play", for = "unix" },
  { run = 'mpv %s1', orphan = true, desc = "Play", for = "windows" },
  { run = '''mpv --vo=tct %s1''', block = true, desc = "Play inline", for = "unix" },
  { run = '''mediainfo %s1; echo "Press enter to exit"; read''', block = true, desc = "Show media info", for = "unix" },
]
view_pdf = [
  { run = 'tdf %s', block = true, desc = "View in Terminal", for = "unix" },
]
view_md = [
  { run = 'treemd %s', block = true, desc = "View in Terminal", for = "unix" },
]

[open]
rules = [
  # Directory
  { url = "*/", use = [
    "edit",
    "open",
    "reveal",
  ] },

  # Specific extensions
  { url = "*.md", use = [
    "view_md",
    "edit",
    "open",
    "reveal",
  ] },
  { url = "*.json", use = [
    "edit",
    "view_source",
    "open",
    "reveal",
  ] },
  { url = "*.pdf", use = [
    "view_pdf",
    "open",
    "reveal",
  ] },

  # MIME wildcards
  { mime = "text/*", use = [
    "edit",
    "view_source",
    "open",
    "reveal",
  ] },
  { mime = "image/*", use = [
    "view_image",
    "open",
    "view_exif",
    "reveal",
  ] },
  { mime = "video/*", use = [
    "play",
    "open",
    "reveal",
  ] },
  { mime = "audio/*", use = [
    "play",
    "open",
    "reveal",
  ] },

  # Specific MIME types
  { mime = "inode/empty", use = [
    "edit",
    "reveal",
  ] },
  { mime = "application/{zip,gzip,tar,bzip,bzip2,7z-compressed,rar,xz,zstd,lzma,lz4}", use = [
    "extract",
    "reveal",
  ] },

  # Trash
  { mime = "trash/**", use = [
    "open",
    "trash",
  ] },

  # Fallback
  { url = "*", use = [
    "open",
    "reveal",
  ] },
]

[tasks]
bizarre_retry = 5
image_bound = [32768, 32768]
