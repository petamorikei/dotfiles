# env: manjaro. Tools Manjaro installs with cargo that Ubuntu gets from mise's
# registry (config.ubuntu.toml).

[tools]
"cargo:git-delta" = "latest"
"cargo:harper-ls" = { version = "latest", locked = true }
"cargo:watchexec-cli" = { version = "latest", locked = true }

# Linux system services; macOS and containers never load this file.
[bootstrap.services.sshd]
state = "running"
enabled = true
