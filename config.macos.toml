# macOS only (loaded through auto_env).

[tools]
"cargo:git-delta" = "latest"
"cargo:harper-ls" = { version = "latest", locked = true }
"cargo:https://github.com/itsjunetime/tdf" = "latest"
"cargo:typora-img-to-base64" = "latest"
"cargo:voicepeak-cli" = "latest"

# RARLAB's CLI; Homebrew disabled the rar cask because it fails Gatekeeper.
# The http backend fills {{ version }} in literally, so bump both the version
# and the 723 in the file name.
[tools."http:rar"]
version = "7.23"
url = "https://www.rarlab.com/rar/rarmacos-{{ arch(arm64=\"arm\") }}-723.tar.gz"

[dotfiles]
# Karabiner-Elements rewrites karabiner.json in place of a symlinked file, so
# link the whole directory as its documentation recommends.
"~/.config/karabiner" = { source = "home-macos/.config/karabiner", mode = "symlink" }
"~/.config/vpsay/config.toml" = { source = "home-macos/.config/vpsay/config.toml", mode = "symlink" }

[bootstrap.hooks]
# Real Homebrew installs the Brewfile; mas entries only on physical machines,
# main and work entries only with the `main` and `work` envs. Personal entries
# need `secrets` as well as no `work`: kickstart adds `work` only with
# `secrets`, so without `secrets` (stage 1) whether the machine is a work
# machine is not known yet.
post-packages = '''
HOMEBREW_BREWFILE_MAS={% if mise_env is defined and "physical" in mise_env %}1{% else %}0{% endif %} \
HOMEBREW_BREWFILE_MAIN={% if mise_env is defined and "main" in mise_env %}1{% else %}0{% endif %} \
HOMEBREW_BREWFILE_WORK={% if mise_env is defined and "work" in mise_env %}1{% else %}0{% endif %} \
HOMEBREW_BREWFILE_PERSONAL={% if mise_env is defined and "secrets" in mise_env and "work" not in mise_env %}1{% else %}0{% endif %} \
brew bundle --no-upgrade --file "{{ xdg_config_home }}/mise/Brewfile"
{% if mise_env is defined and "work" in mise_env -%}
# WithSecure installs without a key. Activate it once: the agent keeps its
# subscription state in fsmac/substatus, which is empty until activation.
# Without the key, leave it installed but inactive; the next apply with the
# key activates it.
if [ -z "$(ls -A /Library/WithSecure/fsmac/substatus 2>/dev/null)" ]; then
  if [ -n "${WITHSECURE_SUBSCRIPTION_KEY:-}" ]; then
    sudo /Library/WithSecure/bin/activator --subscription-key "$WITHSECURE_SUBSCRIPTION_KEY"
  else
    echo "WithSecure is not activated: add WITHSECURE_SUBSCRIPTION_KEY to Bitwarden and run mise run apply" >&2
  fi
fi
{%- endif %}
'''
# pmset keeps settings per power source. On AC power neither the system nor
# the display sleeps; on battery they wait an hour, without Low Power Mode.
# pmset needs sudo, so it runs only when a listed value differs, and only for
# the power sources `pmset -g custom` lists (desktops have no battery).
# Dock is restarted at once: until it rereads its preferences it keeps the old
# app layout, and writes it back over dock.apps the next time an app launches.
post-defaults = '''
killall Dock || true

pmset_source() {
  section=$1 flag=$2
  shift 2
  if pmset -g custom | awk -v section="$section:" -v want="$*" '
      BEGIN { n = split(want, kv); for (i = 1; i < n; i += 2) w[kv[i]] = kv[i + 1] }
      /^[^ ]/ { in_section = index($0, section) == 1; next }
      in_section && ($1 in w) && $2 != w[$1] { found = 1 }
      END { exit !found }'; then
    sudo pmset "$flag" "$@"
  fi
}
pmset_source "AC Power" -c sleep 0 displaysleep 0
pmset_source "Battery Power" -b sleep 60 displaysleep 60 disksleep 60 lowpowermode 0
'''

# ── System settings ─────────────────────────────────────────
# Enforced on every bootstrap: change them here, not in System Settings.

[bootstrap.macos.dock]
apps = []
autohide = true
mru_spaces = false
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
sort_folders_first = true

[bootstrap.macos.keyboard]
automatic_capitalization = false
automatic_spelling_correction = false
initial_key_repeat = 25
key_repeat = 2

[bootstrap.macos.defaults."com.apple.dock"]
mineffect = "scale"
showAppExposeGestureEnabled = true
# Hot corner: bottom right shows the desktop
wvous-br-corner = 4
wvous-br-modifier = 0

[bootstrap.macos.defaults."com.apple.finder"]
FXDefaultSearchScope = "SCcf"
NewWindowTarget = "PfHm"
"NSWindowTabbingShoudShowTabBarKey-com.apple.finder.TBrowserWindow" = true
_FXShowPosixPathInTitle = true
_FXSortFoldersFirstOnDesktop = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
NSAutomaticDashSubstitutionEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false
NSNavPanelExpandedStateForSaveMode = true
WebAutomaticSpellingCorrectionEnabled = false
"com.apple.springing.delay" = 0.2
# Liquid Glass tint
NSGlassTintAmount = 0.9800326

[bootstrap.macos.defaults]
"com.apple.AppleMultitouchTrackpad" = { TrackpadThreeFingerVertSwipeGesture = 2 }
"com.apple.CrashReporter" = { DialogType = "none" }
"com.apple.WindowManager" = { EnableStandardClickToShowDesktop = false, EnableTiledWindowMargins = false, HideDesktop = true }
# Siri off
"com.apple.assistant.support" = { "Assistant Enabled" = false }
"com.apple.desktopservices" = { DSDontWriteNetworkStores = true }
"com.apple.dt.Xcode" = { ShowBuildOperationDuration = true }
"com.apple.frameworks.diskimages" = { skip-verify = true, skip-verify-locked = true, skip-verify-remote = true }
"com.apple.inputmethod.Kotoeri" = { JIMPrefLiveConversionKey = false }
"com.apple.menuextra.clock" = { Show24Hour = true, ShowDayOfWeek = true, ShowSeconds = true }
"com.apple.screencapture" = { disable-shadow = true }
"com.apple.sidecar.display" = { showTouchbar = false, sidebarShown = false }
"com.apple.touchbar.agent" = { PresentationModeGlobal = "fullControlStrip" }
# Hide the input source indicator when switching languages.
kCFPreferencesAnyApplication = { TSMLanguageIndicatorEnabled = 0 }

# Per-machine preferences (defaults -currentHost)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.screensaver"
key = "idleTime"
host = "current"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.coreservices.useractivityd"
key = "ActivityAdvertisingAllowed"
host = "current"
value = false

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.coreservices.useractivityd"
key = "ActivityReceivingAllowed"
host = "current"
value = false

# Universal Control off
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.universalcontrol"
key = "Disable"
host = "current"
value = true

# Narrower spacing between menu bar icons
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "NSStatusItemSpacing"
host = "current"
value = 6

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "NSStatusItemSelectionPadding"
host = "current"
value = 6

# Keyboard shortcuts off (they apply after the next login): 64 is Spotlight
# (⌘Space), 60 the previous input source (⌃Space), 52 Dock hiding (⌥⌘D).
# `path` changes only `enabled` and keeps the rest of AppleSymbolicHotKeys.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64", "enabled"]
value = false

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["60", "enabled"]
value = false

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["52", "enabled"]
value = false

# ── App settings ────────────────────────────────────────────
# Enforced on every bootstrap like the system settings above: change them
# here, not in the apps. Only settings are listed; per-install IDs, licenses,
# window state, and update bookkeeping stay out.

# AltTab stores its settings as strings, numbers and booleans alike. Its
# shortcuts are archived data and are not managed here.
[bootstrap.macos.defaults."com.lwouis.alt-tab-macos"]
appearanceSize = "1"
appearanceTheme = "1"
appsToShow2 = "0"
hideSpaceNumberLabels = "true"
previewFocusedWindow = "false"
screensToShow = "1"
showHiddenWindows = "1"
showHiddenWindows2 = "1"
showMinimizedWindows = "2"
showMinimizedWindows2 = "2"
showOnScreen = "1"
showWindowlessApps = "1"
showWindowlessApps2 = "1"
titleTruncation = "2"
updatePolicy = "1"

# Browserino keeps each setting as a JSON string. Every app in `browsers` comes
# from the common casks; an entry for a missing app would take a slot in the
# picker. Apps that are not browsers stay hidden, and so does Parallels Desktop
# (personal machines), which Rescan adds. `shortcuts` is keyed by bundle ID.
[bootstrap.macos.defaults."xyz.alexstrnik.Browserino"]
browsers = '["file:///Applications/Google%20Chrome.app/","file:///Applications/Google%20Chrome%20Beta.app/","file:///Applications/Google%20Chrome%20Dev.app/","file:///Applications/Google%20Chrome%20Canary.app/","file:///System/Volumes/Preboot/Cryptexes/App/System/Applications/Safari.app/","file:///Applications/Firefox.app/","file:///Applications/Microsoft%20Edge.app/","file:///Applications/iTerm.app/","file:///Applications/BetterTouchTool.app/","file:///Applications/ChatGPT.app/"]'
hiddenBrowsers = '["file:///Applications/iTerm.app/","file:///Applications/BetterTouchTool.app/","file:///Applications/ChatGPT.app/","file:///Applications/Parallels%20Desktop.app/"]'
shortcuts = '{"com.google.Chrome.beta":"B","com.google.Chrome.dev":"D","com.google.Chrome.canary":"C","com.apple.Safari":"S","org.mozilla.firefox":"F","com.microsoft.edgemac":"E"}'
directories = '[{"directoryPath":"/Applications"}]'

# Themeable comes from kickstart, which installs it once Typora has created its
# themes directory; it follows the system appearance by itself. HTML export
# inlines images with typora-img-to-base64 (cargo tool above).
[bootstrap.macos.defaults."abnerworks.Typora"]
theme = "Themeable"
useSeparateDarkTheme = false
apply_image_move_for_web = true
autoEscapeImageURL = true
copy_markdown_by_default = true
enable_inline_math = false
image_save_location = "per-file-assert"
preLinebreakOnExport = true
relativePathWithDot = true
send_usage_info = true
strict_mode = true
use_relative_path_for_img = true
use_seamless_window = true
"export.html" = { runCommand = true, runCommandStr = "zsh -c 'typora-img-to-base64 \"${currentPath}\" \"${outputPath}\"'" }
