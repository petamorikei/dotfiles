# Shared by every machine. Platform files (config.macos.toml,
# config.linux.toml) load through auto_env; the env files (config.<env>.toml)
# load for the envs listed in miserc.local.toml. See README.md.
min_version = "2026.10.13"

[settings]
# Let cargo-binstall use cargo-quickinstall like plain cargo-binstall does, so
# crates without author-published binaries still install prebuilt artifacts.
cargo.binstall_quickinstall = true

[tools]
bun = "latest"
fnox = "latest"
node = "latest"
pnpm = "latest"
# mise installs cargo-binstall before the cargo: tools.
cargo-binstall = "latest"
"cargo:cargo-cache" = "latest"
"cargo:cargo-edit" = "latest"
"cargo:cargo-modules" = "latest"
"cargo:cargo-outdated" = { version = "latest", locked = true }
"cargo:cargo-update" = "latest"
"cargo:kuwahara-filter" = "latest"
"cargo:minhtml" = "latest"
"cargo:sd" = "latest"

[dotfiles]
# Not one "~" entry: with no record of its links yet, as on a new machine, mise
# walks the whole target to find stale ones, and on macOS that reaches into
# ~/Library and iCloud Drive. A new top-level file under home/ needs an entry.
"~/.config" = { source = "home/.config", mode = "symlink-each" }
"~/.p10k.zsh" = { source = "home/.p10k.zsh", mode = "symlink" }
"~/.zshrc" = { source = "templates/zshrc.tera", mode = "template" }
"~/.claude/settings.json" = { source = "templates/claude-settings.json.tera", mode = "template" }
"~/.claude/CLAUDE.md" = { source = "templates/claude-md.tera", mode = "template" }
# Thread capture differs on work machines. `atuin setup` and `atuin config set`
# edit the rendered file, which the next apply overwrites: move such edits into
# the template. ~/.atuin/config.toml, not ~/.config/atuin: atuin creates the
# former with its defaults whenever it finds no config, and then reads only
# that one, which the next apply overwrites here.
"~/.atuin/config.toml" = { source = "templates/atuin-config.toml.tera", mode = "template" }
# Zed rewrites its settings file, which would replace a symlink.
"~/.config/zed/settings.json" = { source = "files/zed-settings.json", mode = "copy", permissions = "0600" }
# gh uses the personal account under ~/Workspace (GH_TOKEN, see the file). The
# post-dotfiles hook trusts the link. Work machines add their work directory's
# file in config.work.toml.
"~/Workspace/mise.toml" = { source = "home/Workspace/mise.toml", mode = "symlink" }
# Stops Claude Code's gh commands that would run as a different account than
# the directory's mise config names (Claude Code's shell skips mise's hook).
"~/.claude/hooks/gh-account-guard.sh" = { source = "home/.claude/hooks/gh-account-guard.sh", mode = "symlink" }
# Linear workflow rules; a repository opts in by importing it from its
# CLAUDE.md (`@~/.claude/linear-workflow.md`).
"~/.claude/linear-workflow.md" = { source = "home/.claude/linear-workflow.md", mode = "symlink" }

[bootstrap.user]
# /bin/zsh is the default on macOS and exists on Ubuntu and Manjaro too.
login_shell = "/bin/zsh"

# Values come from the environment; `mise run apply` fills them from Bitwarden
# through fnox.toml. Only templates in config.secrets.toml and config.work.toml
# use them, except these, whose variables hooks read directly:
# withsecure_subscription_key (post-packages in config.macos.toml) and
# gh_work_dir and gh_work_user (pre-dotfiles in config.work.toml).
[bootstrap.secrets]
discord_webhook_url = "DISCORD_WEBHOOK_URL"
gh_work_dir = "GH_WORK_DIR"
gh_work_user = "GH_WORK_USER"
git_email = "GIT_EMAIL"
git_name = "GIT_NAME"
git_work_config = "GIT_WORK_CONFIG"
git_work_user = "GIT_WORK_USER"
ssh_config = "SSH_CONFIG"
withsecure_subscription_key = "WITHSECURE_SUBSCRIPTION_KEY"

# ~/Workspace/mise.toml sets GH_TOKEN with exec(), which mise runs only for
# trusted files.
[bootstrap.hooks.post-dotfiles]
run = ['mise trust -q "$HOME/Workspace/mise.toml"']

[bootstrap.hooks.post-tools]
run = [
  "mise exec -- sheldon lock",
  # bat's ayu-mirage theme (selected by ~/.config/bat/config) is downloaded
  # rather than vendored.
  '''
  themes="$(mise exec -- bat --config-dir)/themes"
  if [ ! -f "$themes/ayu-mirage.tmTheme" ]; then
    mkdir -p "$themes"
    curl -fsSL -o "$themes/ayu-mirage.tmTheme" https://raw.githubusercontent.com/vampirelinux/css/master/ayu-mirage.tmTheme
    mise exec -- bat cache --build
  fi
  ''',
  # The playwright-cli skill ships inside the package (Brewfile, AUR, or npm
  # on Ubuntu). Copy the installed version's skill into ~/.claude/skills on
  # every apply so it follows upgrades; removing it first drops files a newer
  # version no longer has. `--global` installs no browser.
  '''
  rm -rf "$HOME/.claude/skills/playwright-cli"
  mise exec -- playwright-cli install --skills --global
  ''',
]

# Day-to-day apply: `mise run apply` from any directory.
[tasks.apply]
description = "Pull this repository, then apply it with secrets from Bitwarden (needs BW_SESSION)"
# fnox looks for fnox.toml from the working directory upward.
dir = "{{ xdg_config_home }}/mise"
# Pull here rather than with `mise bootstrap --update`: fnox then reads the
# pulled fnox.toml, and pacman skips the `pacman -Sy` that `--update` runs
# before installing, which would make a partial upgrade.
run = [
  "git pull --ff-only",
  "fnox exec -- mise bootstrap",
]
