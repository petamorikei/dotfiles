# env: desktop (machines with a GUI; always selected on macOS).

[tools]
"cargo:noti-rs" = "latest"
# vvsay (VOICEVOX) speaks Claude Code's voice reports on every desktop but the
# `main` one, which uses VOICEPEAK. voicevox_core is not on crates.io, so it
# builds from git; cmake comes from the system packages (Brewfile, apt, pacman)
# because they install before the tools.
"cargo:https://github.com/petamorikei/voicevox-cli" = { version = "latest", locked = true }

[dotfiles]
"~/.config/vvsay/config.toml" = { source = "home-desktop/.config/vvsay/config.toml", mode = "symlink" }

# The skill that tells Claude Code how to speak through vvsay.
[bootstrap.repos]
"~/.claude/skills/vv-reporter" = { url = "https://github.com/petamorikei/vv-reporter.git", ref = "main" }

# VOICEVOX CORE assets (ONNX Runtime, dictionary, voice models; about 1.6 GB).
# --accept-terms accepts the terms of use of the ONNX Runtime and the voice
# models, which the owner of these machines has read and accepted.
[bootstrap.hooks.post-tools]
run = '''
if [ ! -d "$HOME/.local/share/vvsay/models" ]; then
  mise exec -- vvsay --setup --accept-terms </dev/null
fi
'''

[bootstrap.apt.sources.vscode]
uris = "https://packages.microsoft.com/repos/code"
suites = "stable"
key = "https://packages.microsoft.com/keys/microsoft.asc"
fingerprint = "BC52 8686 B50D 79E3 39D3 721C EB3E 94AD BE12 29CF"

[bootstrap.apt.sources.google-chrome]
uris = "https://dl.google.com/linux/chrome-stable/deb/"
suites = "stable"
architectures = "amd64 arm64"
key = "https://dl.google.com/linux/linux_signing_key.pub"
fingerprint = "EB4C 1BFD 4F04 2F6D DDCC EC91 7721 F63B D38B 4796"

# Chrome's package adds its own entry for the same repository with another
# Signed-By, which stops apt. This file keeps it from adding one, and the
# entries machines got before it existed (.sources, or .list from older
# packages) are removed.
[bootstrap.files."/etc/default/google-chrome"]
content = '''
repo_add_once="false"
repo_reenable_on_distupgrade="false"
'''
phase = "pre-packages"
os = "linux"

[bootstrap.files."/etc/apt/sources.list.d/google-chrome.sources"]
state = "absent"
phase = "pre-packages"
os = "linux"

[bootstrap.files."/etc/apt/sources.list.d/google-chrome.list"]
state = "absent"
phase = "pre-packages"
os = "linux"

[bootstrap.packages]
# Ubuntu
"apt:chrome-gnome-shell" = "latest"
"apt:cmake" = "latest"
"apt:chromium-browser" = "latest"
"apt:code" = "latest"
"apt:fcitx5" = "latest"
"apt:fcitx5-mozc" = "latest"
"apt:google-chrome-stable" = "latest"
"apt:vlc" = "latest"
"apt:wine" = "latest"
"apt:xrdp" = "latest"

# Manjaro
"aur:discord" = "latest"
"aur:ghostty" = "latest"
"aur:google-chrome" = "latest"
"aur:google-chrome-beta" = "latest"
"aur:google-chrome-dev" = "latest"
"aur:visual-studio-code-bin" = "latest"
