# Linux only (loaded through auto_env). Ubuntu and Manjaro share this file:
# apt: entries apply where apt exists and pacman:/aur: entries where pacman
# does. Distro-only tools live in config.ubuntu.toml and config.manjaro.toml.

[tools]
"cargo:erdtree" = "latest"
"cargo:hwatch" = "latest"
"cargo:https://github.com/itsjunetime/tdf" = { version = "latest", os = ["linux/x64"] }
"cargo:procs" = "latest"
# npm, not pnpm: pnpm's layout breaks bw's bundled require('buffer/').
# https://github.com/bitwarden/clients/issues/20547
"npm:@bitwarden/cli" = "latest"
"npm:vidls" = "latest"

[bootstrap.packages]
# Ubuntu
"apt:build-essential" = "latest"
"apt:cifs-utils" = "latest"
"apt:curl" = "latest"
"apt:dconf-cli" = "latest"
"apt:expat" = "latest"
"apt:git" = "latest"
"apt:libasound2-dev" = "latest"
"apt:libexpat1-dev" = "latest"
"apt:libfreetype-dev" = "latest"
"apt:libharfbuzz-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:libxcb-composite0-dev" = "latest"
"apt:libxml2-dev" = "latest"
"apt:mediainfo" = "latest"
"apt:mpv" = "latest"
"apt:openssh-server" = "latest"
"apt:pandoc" = "latest"
"apt:peco" = "latest"
"apt:pkg-config" = "latest"
"apt:rar" = { os = ["linux/x64"] }
"apt:rsync" = "latest"
"apt:timg" = "latest"
"apt:tmux" = "latest"
"apt:tree" = "latest"
"apt:unar" = "latest"
"apt:unzip" = "latest"
"apt:webp" = "latest"

# Manjaro
"pacman:base-devel" = "latest"
"pacman:bat" = "latest"
"pacman:btop" = "latest"
"pacman:ccusage" = "latest"
"pacman:cifs-utils" = "latest"
"pacman:cmake" = "latest"
"pacman:curl" = "latest"
"pacman:dconf" = "latest"
"pacman:dua-cli" = "latest"
"pacman:expat" = "latest"
